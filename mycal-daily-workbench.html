<!doctype html>
<html lang="zh-CN" data-theme="mycal">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MyCal · 日常工作台</title>
<link rel="stylesheet" href="assets/workbench.css" />
</head>
<body class="min-h-screen bg-base-200 font-sans text-base-content antialiased">

<!-- ─── 顶栏 ─────────────────────────────────────────────── -->
<header class="sticky top-0 z-20 border-b border-base-300 bg-base-100/85 backdrop-blur-md" data-od-id="appbar">
  <div class="mx-auto flex w-full max-w-[1180px] flex-wrap items-center gap-4 px-7 py-3">
    <span class="mr-auto inline-flex items-center gap-2.5">
      <span class="btn btn-primary btn-square btn-sm font-mono text-xs font-bold">M</span>
      <span class="font-display text-lg font-semibold tracking-tight">MyCal</span>
      <span class="badge badge-ghost badge-sm">日常工作台</span>
    </span>

    <div class="inline-flex items-center gap-1">
      <button type="button" class="btn btn-ghost btn-sm btn-square text-lg" id="prevMonth" aria-label="上个月">‹</button>
      <span class="min-w-[7ch] cursor-pointer text-center font-display font-semibold" id="monthTitle" title="回到今天">2026 · 9 月</span>
      <button type="button" class="btn btn-ghost btn-sm btn-square text-lg" id="nextMonth" aria-label="下个月">›</button>
    </div>

    <button type="button" class="btn btn-ghost btn-sm" id="goToday">今天</button>
    <button type="button" class="btn btn-ghost btn-sm" id="toggleImport">订阅</button>

    <button type="button" class="btn btn-ghost btn-sm btn-square" id="themeToggle" aria-label="切换深色模式">
      <svg class="theme-sun hidden size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="theme-moon size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
  </div>
</header>

<!-- ─── 工作区 ───────────────────────────────────────────── -->
<main class="mx-auto grid w-full max-w-[1180px] grid-cols-1 items-start gap-6 px-7 py-8 pb-14 lg:grid-cols-[1.06fr_1fr]" data-od-id="workspace">

  <!-- 月历 -->
  <section class="rounded-box border border-base-300 bg-base-100 p-6 pb-5 shadow-sm" data-od-id="calendar" aria-label="月历">
    <header class="mb-4 flex items-center justify-between">
      <h2 class="m-0 font-display text-2xl font-semibold tracking-tight">
        2026 · 9 月
        <small class="mt-1 block font-mono text-[11px] font-normal uppercase tracking-[0.08em] text-base-content/50" id="weekTag">第 36 周</small>
      </h2>
      <div class="flex items-center gap-2">
        <button type="button" class="btn btn-ghost btn-sm btn-square text-lg" data-cal="prev" aria-label="上个月">‹</button>
        <button type="button" class="btn btn-ghost btn-sm btn-square text-lg" data-cal="next" aria-label="下个月">›</button>
        <button type="button" class="btn btn-ghost btn-sm" data-cal="today">今天</button>
      </div>
    </header>

    <div class="grid grid-cols-7 gap-[5px]" id="weekdays"></div>
    <div class="grid grid-cols-7 gap-[5px]" id="calGrid" role="grid"></div>

    <div class="mt-3.5 flex items-center gap-4 border-t border-base-300 pt-3.5 font-mono text-[11px] tracking-wide text-base-content/50">
      <span class="inline-flex items-center gap-1.5"><i class="inline-block size-[7px] rounded-full bg-primary"></i>日程</span>
      <span class="inline-flex items-center gap-1.5"><i class="inline-block size-[7px] rounded-full bg-secondary"></i>待办</span>
    </div>
  </section>

  <!-- 当日详情 -->
  <section class="rounded-box border border-base-300 bg-base-100 p-6 shadow-sm lg:p-7" data-od-id="day-panel" aria-label="当日详情">
    <header class="flex items-center justify-between">
      <span class="font-mono text-[11px] uppercase tracking-[0.08em] text-base-content/50">当日概览</span>
      <span class="font-mono text-xs text-base-content/50" id="weekdayLabel">星期三</span>
    </header>

    <h2 class="mb-0 mt-1 leading-none">
      <span class="font-display text-[clamp(30px,3.2vw,42px)] font-semibold tracking-tight" id="dateNum">9月2日</span>
      <span class="ml-1.5 align-[0.4em] font-mono text-sm font-normal text-base-content/45" id="yearTag">2026</span>
    </h2>
    <p class="mb-5 mt-2 font-mono text-[13px] text-base-content/55" id="dayStats">本周第 3 个工作日 · 距离周末还有 3 天</p>

    <div class="mb-5 flex items-center gap-3" data-od-id="progress">
      <span class="whitespace-nowrap font-mono text-xs text-base-content/55" id="progressText">0 / 0 已完成</span>
      <div class="h-1.5 flex-1 overflow-hidden rounded-full bg-base-300">
        <div class="h-full rounded-full bg-primary transition-[width] duration-300" id="progressFill" style="width:0%"></div>
      </div>
    </div>

    <div class="mb-4 grid grid-cols-2 gap-1 rounded-xl bg-base-300/60 p-1" role="tablist" data-od-id="day-tabs">
      <button type="button" id="tabTodo" class="seg-btn active" role="tab" aria-selected="true">待办 <span class="seg-cnt" id="cntTodo">0</span></button>
      <button type="button" id="tabSched" class="seg-btn" role="tab" aria-selected="false">日程 <span class="seg-cnt" id="cntSched">0</span></button>
    </div>

    <ul class="m-0 list-none p-0" id="todoList" data-od-id="todo-list"></ul>

    <form class="mt-4 flex gap-2" id="addRow" data-od-id="add-todo">
      <input class="input input-bordered w-full bg-base-100" id="todoInput" placeholder="新待办…回车添加" aria-label="新待办" />
      <button type="submit" class="btn btn-primary px-5" id="addBtn">添加</button>
    </form>

    <div class="hidden" id="schedZone" data-od-id="schedule">
      <ul class="m-0 list-none p-0" id="schedList"></ul>
    </div>

    <div class="mt-6 border-t border-base-300 pt-5" id="importRow" data-od-id="import">
      <div class="flex items-center justify-between gap-3">
        <span class="font-mono text-[11px] uppercase tracking-[0.08em] text-base-content/50">订阅 .ics 日程</span>
        <span class="badge badge-ghost badge-sm font-mono">本地 SQLite</span>
      </div>
      <form class="mt-3 flex gap-2" id="importForm">
        <input class="input input-bordered w-full bg-base-100" id="icsUrl" placeholder="https://example.com/calendar.ics" aria-label="ICS 订阅链接" />
        <button type="submit" class="btn btn-primary px-5">导入</button>
      </form>
      <p class="hidden text-sm" id="importNote"></p>
    </div>
  </section>
</main>

<!-- ─── 页脚 ─────────────────────────────────────────────── -->
<footer class="border-t border-base-300 bg-base-100/60" data-od-id="footer">
  <div class="mx-auto flex w-full max-w-[1180px] flex-wrap items-center justify-between gap-2.5 px-7 py-8 text-[13px] text-base-content/55">
    <span>© 2026 MyCal · 数据保存在本地 SQLite</span>
    <span class="font-mono text-xs">支持 .ics 订阅导入 · 本地优先</span>
  </div>
</footer>

<script>
(function(){
  const WEEKDAYS = ['一','二','三','四','五','六','日'];
  const pad2 = n => String(n).padStart(2,'0');
  const key = (y,m,d) => `${y}-${pad2(m+1)}-${pad2(d)}`;
  const today = new Date(); today.setHours(0,0,0,0);

  const fmt = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const off = (n)=>{ const d=new Date(fmt); d.setDate(d.getDate()+n); return d; };
  const KY = (d)=> key(d.getFullYear(), d.getMonth(), d.getDate());

  /* ── 主题切换 ─────────────────────────────────────────── */
  const root = document.documentElement;
  document.getElementById('themeToggle').addEventListener('click', ()=>{
    const next = root.getAttribute('data-theme') === 'dim' ? 'mycal' : 'dim';
    root.setAttribute('data-theme', next);
    document.querySelector('.theme-sun').classList.toggle('hidden', next !== 'dim');
    document.querySelector('.theme-moon').classList.toggle('hidden', next !== 'mycal');
  });

  const DB = {};
  function put(d, todos, events){
    const k = KY(d);
    if(!DB[k]) DB[k]={todos:[],events:[]};
    if(todos) DB[k].todos.push(...todos);
    if(events) DB[k].events.push(...events);
  }
  let idc=0;
  const T=(text,done,src)=> ({id:'t'+(idc++), text, done:!!done, src:src||'todo'});
  const E=(time,end,text)=> ({time,end,text});

  put(off(0), [T('复查 #148 导出服务迁移的 diff', true), T('修复 ICS 重复导入去重逻辑', false), T('准备周五代码评审材料', false)], [E('09:30','10:00','站会 · 前端组'), E('14:00','15:30','代码评审 · 迁移重构')]);
  put(off(1), [T('更新本周周报要点', false)], []);
  put(off(-1), [T('跟进线上问题工单', true)], []);
  put(off(3), [], [E('15:30','17:00','季度 OKR 复盘')]);
  put(off(-3), [T('整理接口变更文档', false)], [E('20:00','21:00','版本发布窗口')]);
  put(off(6), [], [E('16:00','17:00','全栈分享 · 数据层设计')]);
  put(off(12), [T('评审移动端日程交互稿', true)], []);

  let viewY = today.getFullYear(), viewM = today.getMonth();
  let selectedKey = KY(today);
  let tab = 'todo';

  const el = {
    grid: document.getElementById('calGrid'), weekdays: document.getElementById('weekdays'),
    monthTitle: document.getElementById('monthTitle'), weekTag: document.getElementById('weekTag'),
    dateNum: document.getElementById('dateNum'), yearTag: document.getElementById('yearTag'),
    weekdayLabel: document.getElementById('weekdayLabel'), dayStats: document.getElementById('dayStats'),
    progressText: document.getElementById('progressText'), progressFill: document.getElementById('progressFill'),
    cntTodo: document.getElementById('cntTodo'), cntSched: document.getElementById('cntSched'),
    todoList: document.getElementById('todoList'), schedList: document.getElementById('schedList'),
    schedZone: document.getElementById('schedZone'), addRow: document.getElementById('addRow'),
    todoInput: document.getElementById('todoInput'), addBtn: document.getElementById('addBtn'),
  };

  function weekday(d){ return WEEKDAYS[(d.getDay()+6)%7]; }
  function weekOfYear(d){
    const t=new Date(d); t.setHours(0,0,0,0); t.setDate(t.getDate()+3-((t.getDay()+6)%7));
    const wk4=new Date(t.getFullYear(),0,4);
    return 1+Math.round(((t-wk4)/86400000 - (wk4.getDay()+6)%7 + 7)/7);
  }

  function renderWeekdays(){
    el.weekdays.innerHTML = WEEKDAYS.map(w=>
      `<span class="pb-2 text-center font-mono text-[11px] tracking-wide text-base-content/45">${w}</span>`).join('');
  }

  function marksFor(k){ const e=DB[k]||{}; const m=[]; if(e.events&&e.events.length) m.push('a'); if(e.todos&&e.todos.length) m.push('t'); return m; }

  function renderGrid(){
    const lead = (new Date(viewY, viewM, 1).getDay()+6)%7;
    const todayK = KY(today);
    let html='';
    for(let i=0;i<42;i++){
      const d = new Date(viewY, viewM, 1 - lead + i);
      const k = KY(d);
      const inM = d.getMonth()===viewM;
      const sel = k===selectedKey, isToday = k===todayK;
      const cls = [
        'relative flex min-h-[58px] cursor-pointer flex-col items-center rounded-[10px] pt-2 font-mono text-[15px] transition-colors duration-150',
        'focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-primary',
        !inM ? 'text-base-content/25' : 'text-base-content',
        !sel ? 'hover:bg-base-content/5' : 'bg-primary font-semibold text-primary-content',
        isToday && !sel ? 'shadow-[inset_0_0_0_2px_var(--color-primary)] font-semibold' : '',
      ].filter(Boolean).join(' ');
      const marks = marksFor(k).map(c=>{
        const dot = sel ? 'bg-primary-content/90' : (c==='a' ? 'bg-primary' : 'bg-secondary');
        return `<span class="size-1.5 rounded-full ${dot}"></span>`;
      }).join('');
      html += `<button type="button" class="${cls}" role="gridcell" data-key="${k}" aria-label="${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日"><span class="tabular-nums">${d.getDate()}</span><span class="mt-1.5 flex gap-[3px]">${marks}</span></button>`;
    }
    el.grid.innerHTML = html;
  }

  function monthSummary(){
    el.monthTitle.textContent = `${viewY} · ${viewM+1} 月`;
    el.weekTag.textContent = `第 ${36 + (viewM - today.getMonth()) } 周`;
  }

  function renderDay(){
    const [y,m,d] = selectedKey.split('-').map(Number);
    const dObj = new Date(y, m-1, d);
    const k = selectedKey;
    const data = DB[k] || {todos:[],events:[]};

    el.dateNum.textContent = `${m}月${d}日`;
    el.yearTag.textContent = `${y}`;
    el.weekdayLabel.textContent = `星期${weekday(dObj)}`;

    const diff = Math.round((dObj - today)/86400000);
    el.dayStats.textContent = (diff===0 ? '今天 · ' : '') + `第 ${weekOfYear(dObj)} 周`;

    const todos = data.todos||[], events = data.events||[];
    const done = todos.filter(t=>t.done).length;
    el.progressText.textContent = `${done} / ${todos.length} 已完成`;
    el.progressFill.style.width = todos.length? (done/todos.length*100)+'%' : '0%';

    el.cntTodo.textContent = todos.length;
    el.cntSched.textContent = events.length;

    if(tab==='todo'){
      el.todoList.classList.remove('hidden');
      el.schedZone.classList.add('hidden');
      renderTodo(todos);
    } else {
      el.todoList.classList.add('hidden');
      el.addRow.classList.add('hidden');
      el.schedZone.classList.remove('hidden');
      renderSched(events);
    }
  }

  const srcBadge = (t)=> `<span class="mr-1.5 inline-block rounded-full px-2 py-px align-[1px] font-mono text-[11px] tracking-wide ${t.src==='ics'?'bg-primary/12 text-primary':'bg-secondary/12 text-secondary'}">${t.src==='ics'?'日程':'待办'}</span>`;

  function renderTodo(todos){
    if(!todos.length){
      el.todoList.innerHTML = `<li class="py-8 text-center text-sm text-base-content/50">这天还没有待办<small class="mt-1.5 block font-mono text-xs">在下方输入，回车即可添加</small></li>`;
      return;
    }
    el.todoList.innerHTML = todos.map(t=>`
      <li class="flex items-start gap-3 border-b border-base-300 py-3" data-id="${t.id}">
        <label class="flex min-w-0 flex-1 cursor-pointer items-start gap-3">
          <span class="box mt-0.5 grid size-5 flex-none place-items-center rounded-md border-[1.5px] transition-colors ${t.done?'border-primary bg-primary':'border-base-300'}">
            <svg class="size-3 stroke-base-100 transition-opacity ${t.done?'opacity-100':'opacity-0'}" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </span>
          <span class="text-[15px] leading-snug ${t.done?'text-base-content/45 line-through decoration-base-300':''}">${srcBadge(t)}${escapeHtml(t.text)}</span>
        </label>
        <button type="button" class="del grid size-[26px] flex-none place-items-center rounded-md text-base-content/30 transition-colors hover:bg-secondary/10 hover:text-secondary" aria-label="删除">✕</button>
      </li>`).join('');
    taskItems();
  }

  function renderSched(events){
    if(!events.length){
      el.schedList.innerHTML = `<li class="py-8 text-center text-sm text-base-content/50">这天没有日程<small class="mt-1.5 block font-mono text-xs">订阅 .ics 后自动出现在这里</small></li>`;
      return;
    }
    el.schedList.innerHTML = events.map(e=>`
      <li class="grid grid-cols-[96px_1fr] items-start gap-3.5 border-b border-base-300 py-3">
        <div class="pt-0.5 font-mono text-[13px] tabular-nums text-primary">${e.time}<span class="text-base-content/40">${e.end?'–'+e.end:''}</span></div>
        <div class="relative pl-4 before:absolute before:bottom-1.5 before:left-0 before:top-1.5 before:w-[3px] before:rounded-full before:bg-primary/30">
          <div class="text-[15px] leading-snug"><span class="mr-1.5 inline-block rounded-full bg-primary/12 px-2 py-px align-[1px] font-mono text-[11px] text-primary">ICS</span>${escapeHtml(e.text)}</div>
        </div>
      </li>`).join('');
  }

  function taskItems(){
    el.todoList.querySelectorAll('li.task, li[data-id]').forEach(li=>{
      const id = li.dataset.id;
      li.querySelector('label').addEventListener('click', (e)=>{
        e.preventDefault();
        const k=selectedKey; const arr=DB[k].todos;
        const t = arr.find(x=>x.id===id); if(t) t.done=!t.done;
        renderDay(); renderGrid();
      });
      li.querySelector('.del').addEventListener('click', ()=>{
        const k=selectedKey; const arr=DB[k].todos;
        const i=arr.findIndex(x=>x.id===id); if(i>-1) arr.splice(i,1);
        renderDay(); renderGrid();
      });
    });
  }

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function selectDay(k){ selectedKey=k; renderGrid(); renderDay(); }
  function goToday(){ viewY=today.getFullYear(); viewM=today.getMonth(); selectedKey=KY(today); renderGrid(); monthSummary(); renderDay(); }
  function step(d){ viewM+=d; if(viewM<0){viewM=11;viewY--;} if(viewM>11){viewM=0;viewY++;} renderGrid(); monthSummary(); renderDay(); }

  document.getElementById('monthTitle').addEventListener('click', goToday);
  document.getElementById('goToday').addEventListener('click', goToday);
  document.getElementById('prevMonth').addEventListener('click', ()=>step(-1));
  document.getElementById('nextMonth').addEventListener('click', ()=>step(1));
  document.querySelectorAll('[data-cal]').forEach(b=>{
    b.addEventListener('click', ()=>{ const t=b.dataset.cal; if(t==='prev') step(-1); else if(t==='next') step(1); else goToday(); });
  });
  el.grid.addEventListener('click', (e)=>{ const b=e.target.closest('[data-key]'); if(b && b.dataset.key) selectDay(b.dataset.key); });

  document.getElementById('tabTodo').addEventListener('click', ()=> setTab('todo'));
  document.getElementById('tabSched').addEventListener('click', ()=> setTab('sched'));
  function setTab(t){
    tab=t;
    document.getElementById('tabTodo').classList.toggle('active', t==='todo');
    document.getElementById('tabSched').classList.toggle('active', t==='sched');
    document.getElementById('tabTodo').setAttribute('aria-selected', t==='todo');
    document.getElementById('tabSched').setAttribute('aria-selected', t==='sched');
    el.addRow.classList.toggle('hidden', t==='sched');
    renderDay();
  }

  el.addRow.addEventListener('submit', (e)=>{
    e.preventDefault();
    const text = el.todoInput.value.trim(); if(!text) return;
    if(!DB[selectedKey]) DB[selectedKey]={todos:[],events:[]};
    DB[selectedKey].todos.push(T(text,false,'todo'));
    el.todoInput.value=''; renderDay(); renderGrid();
  });

  document.getElementById('toggleImport').addEventListener('click', ()=>{
    const row = document.getElementById('importRow');
    if(row) row.classList.toggle('hidden');
  });
  const importForm = document.getElementById('importForm');
  if(importForm){
    importForm.addEventListener('submit', (e)=>{
      e.preventDefault();
      const inp = document.getElementById('icsUrl'); const url = inp.value.trim();
      const note = document.getElementById('importNote');
      if(!url){ note.textContent='请输入 .ics 订阅链接'; note.className='mt-2 text-sm text-error'; return; }
      note.textContent='这是一个设计原型：订阅导入将在接入后端 API 后生效。'; note.className='mt-2 text-sm text-success';
    });
  }

  renderWeekdays(); renderGrid(); monthSummary(); renderDay();
})();
</script>
</body>
</html>
