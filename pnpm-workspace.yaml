# pnpm 11 项目级配置
# - packages: 声明根为唯一工作区成员(pnpm 10 要求此字段存在,CI 兼容)
# - esbuild / @parcel/watcher 需要执行安装脚本(vite 依赖)
packages:
  - '.'
minimumReleaseAge: 0
# pnpm ≤10 的白名单格式(pnpm 11 起改为 allowBuilds,两种并存保证兼容)
onlyBuiltDependencies:
  - esbuild
  - '@parcel/watcher'
allowBuilds:
  '@parcel/watcher': true
  # core-js / es5-ext 的安装脚本只打印捐赠横幅,不需要执行
  core-js: false
  es5-ext: false
  esbuild: true
  # workerd 是已移除的 wrangler 的遗留依赖,它的安装脚本不需要执行。
  # 注意:pnpm 会自己把这里写成占位字符串 "set this to true or false",
  # 而占位符会让 pnpm install 以 ERR_PNPM_IGNORED_BUILDS 退出码 1 —— 必须是明确的 true/false。
  workerd: false
